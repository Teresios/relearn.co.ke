name: 🚀 Deploy to Live Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to relearn.co.ke
    runs-on: ubuntu-latest

    steps:
      - name: 🔔 Trigger deployment webhook
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          # Build the payload
          PAYLOAD='{"ref":"refs/heads/main","pusher":{"name":"github-actions"}}'
          
          # Generate HMAC signature
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" | sed 's/^.* //')
          
          echo "Triggering deploy webhook..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD" \
            https://www.relearn.co.ke/deploy.php)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "Response code: $HTTP_CODE"
          echo "Response body: $BODY"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Deployment triggered successfully"

      - name: ✅ Verify deployment
        run: |
          echo "Waiting 15s for deployment to complete..."
          sleep 15
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://www.relearn.co.ke/)
          echo "Site responded with HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Warning: Site returned HTTP $HTTP_CODE after deploy"
          else
            echo "✅ Site is live and responding!"
          fi
